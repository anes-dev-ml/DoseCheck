name: Flutter checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Apply reviewed async context fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/features/settings/presentation/settings_page.dart')
          source = path.read_text()

          before = "    final l10n = AppLocalizations.of(context);\n\n    if (enabled) {"
          after = (
              "    final l10n = AppLocalizations.of(context);\n"
              "    final reminderMessages = _reminderMessages(l10n);\n\n"
              "    if (enabled) {"
          )
          if before not in source:
              raise SystemExit('Could not find reminder localization insertion point')
          source = source.replace(before, after, 1)

          before = "          messages: _reminderMessages(AppLocalizations.of(context)),"
          after = "          messages: reminderMessages,"
          if before not in source:
              raise SystemExit('Could not find reminder message async-context use')
          source = source.replace(before, after, 1)

          before = (
              "    } catch (_) {\n"
              "      _showLocalFailure(context);\n"
              "    }\n"
              "  }\n\n"
              "  Future<void> _confirmReset"
          )
          after = (
              "    } catch (_) {\n"
              "      if (!context.mounted) {\n"
              "        return;\n"
              "      }\n"
              "      _showLocalFailure(context);\n"
              "    }\n"
              "  }\n\n"
              "  Future<void> _confirmReset"
          )
          if before not in source:
              raise SystemExit('Could not find language failure handler')
          source = source.replace(before, after, 1)

          path.write_text(source)

      - name: Apply formatting
        run: dart format lib test

      - name: Commit reviewed fixes
        run: |
          if ! git diff --quiet -- lib test; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test
            git commit -m "Guard Settings async context usage"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug
