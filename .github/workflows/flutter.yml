name: Flutter checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Remove redundant Today image default
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/features/today/presentation/today_page.dart')
          source = path.read_text()
          target = '                          filterQuality: FilterQuality.medium,\n'
          if target in source:
              source = source.replace(target, '', 1)
              path.write_text(source)

      - name: Commit cleanup
        run: |
          if ! git diff --quiet -- lib/features/today/presentation/today_page.dart; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/features/today/presentation/today_page.dart
            git commit -m "Remove redundant Today image default"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug
