name: dosecheck
description: "A local-first medication log that helps remove dose uncertainty."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^20.1.0
  flutter_timezone: ^5.1.0
  hive_ce_flutter: ^2.3.4
  intl: any
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/icons/
